# Netlify configuration for Olympia Detailing
# Serves city pages at clean, extensionless URLs that match each page's
# canonical tag and the sitemap (e.g. /mobile-detailing-wayne-pa).

[build]
  publish = "."

# Pretty URLs: strip .html so /mobile-detailing-wayne-pa serves the file.
[[redirects]]
  from = "/mobile-detailing-wayne-pa"
  to = "/mobile-detailing-wayne-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-king-of-prussia-pa"
  to = "/mobile-detailing-king-of-prussia-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-villanova-pa"
  to = "/mobile-detailing-villanova-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-malvern-pa"
  to = "/mobile-detailing-malvern-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-newtown-square-pa"
  to = "/mobile-detailing-newtown-square-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-plymouth-meeting-pa"
  to = "/mobile-detailing-plymouth-meeting-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-philadelphia-pa"
  to = "/mobile-detailing-philadelphia-pa.html"
  status = 200

[[redirects]]
  from = "/mobile-detailing-berwyn-pa"
  to = "/mobile-detailing-berwyn-pa.html"
  status = 200
